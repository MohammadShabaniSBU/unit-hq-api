[program:laravel-queue]
command=php /app/artisan queue:work --timeout=3600 --quiet
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0
user=application

