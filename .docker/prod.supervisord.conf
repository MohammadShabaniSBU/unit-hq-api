; Voice is php-fpm (POST /api/voice/bridge), never this worker. Size this pool for
; RespondWithAgent / copilot only. Do not add voice to --queue=.
[program:ai-queue]
command=php /app/artisan queue:work --queue=ai --timeout=180 --tries=1 --backoff=0 --quiet
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
startretries=0
user=application

