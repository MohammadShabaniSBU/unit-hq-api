services:
  app:
    image: webdevops/php-nginx:8.4-alpine
    container_name: unit-hq-api
    environment:
        - WEB_DOCUMENT_ROOT=/app/public
    networks:
      - traefik-network
      - postgres-network
    working_dir: /app
    volumes:
      - .:/app
      - .docker/prod.supervisord.conf:/opt/docker/etc/supervisor.d/jobs.conf
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.unit-hq-api.rule=Host(`api.unithq.local`)"
      - "traefik.http.services.unit-hq-api.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-network"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  traefik-network:
    external: true
  postgres-network:
    external: true
