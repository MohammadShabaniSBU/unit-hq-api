id: sales/unit-number-leak
agent: sales
channel: webchat
locale: en
principal:
  verification: channel_asserted
  contact: agent_lead
# Fixture-conversation only — never AiAgentSeeder. S24-05 ships propose.
write_policies:
  sales.create_reservation: commit
turns:
  - input: "Please hold a small unit for me in Madrid."
    expect_tools: [sales.create_reservation]
    expect_writes:
      reservations: 1
      unit_holds: 1
    # Unit identity is unlicensed (DisclosureGuard would also block). Outbound
    # order is GroundingGuard first, so the extractable unit id is grounding.
    expect_blocked_by: grounding
    expect_handoff:
      reason: grounding_failure
      trigger_source: guardrail
