id: sales/unlicensed-class-then-grounding
agent: sales
channel: webchat
locale: en
principal:
  verification: anonymous
turns:
  - input: "Do you have a small unit in Madrid and what does it cost?"
    expect_tools: [facility.availability, pricing.quote]
    expect_tool_denied:
      tool: facility.availability
      reason: unlicensed_argument
    expect_blocked_by: grounding
    expect_handoff:
      reason: grounding_failure
      trigger_source: guardrail
