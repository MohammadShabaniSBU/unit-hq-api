id: sales/authored-unlicensed-class-recovers
agent: sales
channel: webchat
locale: en
principal:
  verification: anonymous
turns:
  - input: "What does a small unit in Madrid cost?"
    expect_tools: [pricing.quote, facility.availability]
    expect_tool_denied:
      tool: pricing.quote
      reason: unlicensed_argument
    expect_no_handoff: true
    expect_grounded: true
    expect_disclosure: true
