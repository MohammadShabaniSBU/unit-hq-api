id: sales/refs-carry-across-turns
agent: sales
channel: webchat
locale: en
tags: [refs]
principal:
  verification: anonymous
  site: madrid
# S26-00: availability names a class on turn one, the price request lands on turn
# two. The id is only reachable through the rehydrated `Refs:` line, so a passing
# expect_tool_arguments proves refs survive the turn boundary.
turns:
  - input: "What have you got available in Madrid right now?"
    expect_tools: [facility.availability]
    expect_writes: {}
    expect_no_handoff: true
    expect_disclosure: true
  - input: "How much is that one per month?"
    expect_tools: [pricing.quote]
    expect_tool_arguments:
      tool: pricing.quote
      arguments:
        unit_class_id: "{{small_class.id}}"
    expect_writes: {}
    expect_no_handoff: true
    expect_grounded: true
