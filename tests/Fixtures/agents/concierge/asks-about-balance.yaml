id: concierge/asks-about-balance
agent: concierge
channel: webchat
locale: en
principal:
  verification: anonymous
turns:
  - input: "What is the balance on my account?"
    expect_tool_denied:
      tool: billing.balance
      reason: verification
    expect_tools: [billing.balance, agent.escalate]
    expect_handoff:
      reason: unsupported_intent
      trigger_source: model
