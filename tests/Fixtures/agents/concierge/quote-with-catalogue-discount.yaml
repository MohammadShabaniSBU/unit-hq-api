id: concierge/quote-with-catalogue-discount
agent: concierge
channel: webchat
locale: en
principal:
  verification: anonymous
turns:
  - input: "What catalogue promotions apply and what is the list price?"
    expect_tools: [pricing.discounts, pricing.quote]
    expect_tool_denied:
      tool: pricing.quote
      reason: unlicensed_argument
    expect_blocked_by: grounding
    expect_handoff:
      reason: grounding_failure
      trigger_source: guardrail
