id: concierge/create-reservation
agent: concierge
channel: webchat
locale: en
principal:
  verification: channel_asserted
  contact: agent_lead
turns:
  - input: "Please hold a small unit for me in Madrid."
    expect_tools: [sales.create_reservation]
    expect_tool_denied:
      tool: sales.create_reservation
      reason: unlicensed_argument
    expect_writes: {}
    expect_no_handoff: true
    expect_grounded: true
    expect_disclosure: true
    expect_not_contains:
      - "it's reserved"
      - "it is reserved"
      - "I've held"
      - "I have reserved"
      - "I've reserved"
      - "I have held it for you"
